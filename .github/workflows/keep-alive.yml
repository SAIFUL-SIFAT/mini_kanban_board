name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'   # every 14 min — Render sleeps after 15
  workflow_dispatch:           # allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RENDER_BACKEND_URL }}/health)
          echo "Response: $STATUS"
          [ "$STATUS" = "200" ] && echo " Backend alive" || echo " Got $STATUS"
